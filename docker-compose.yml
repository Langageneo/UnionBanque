services:
  postgres:
    image: postgres:16-alpine
    container_name: unionbanque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unionbanque
      POSTGRES_PASSWORD: unionbanque_dev_pwd
      POSTGRES_DB: unionbanque
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
